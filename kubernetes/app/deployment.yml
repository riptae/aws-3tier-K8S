apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: todo
spec:
  replicas: 2
  selector:
    matchLabels: {app: app} # Deployment가 관리할 Pod를 식별
  template:
    metadata:
      labels: {app: app} # Deployment가 만드는 Pod에 붙일 라벨
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: app}
      containers:
        - name: app
          image: APP_IMAGE
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
          envFrom:
            - secretRef:
                name: app-db
          readinessProbe:
            httpGet: {path: /api/health, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5          
          # DB 장애로 재시작을 반복하지 않도록 프로세스의 TCP 대기 상태만 확인
          livenessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 20
          startupProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 5
            failureThreshold: 60
