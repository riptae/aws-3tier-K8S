apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: todo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: web
          image: WEB_IMAGE
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: '1', memory: 128Mi}

          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
            timeoutSeconds: 5
          # DB 장애로 재시작을 반복하지 않도록 프로세스의 TCP 대기 상태만 확인
          livenessProbe:
            tcpSocket: {port: 80}
            periodSeconds: 20
          startupProbe:
            tcpSocket: {port: 80}
            periodSeconds: 5
            failureThreshold: 60
